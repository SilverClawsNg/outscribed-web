<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Soft Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Accent Frame Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.25" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Floating Cards -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <!-- Pattern Background for Geometric Depth -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="url(#bgGradient)" />

  <!-- Subtle Dots Grid Pattern -->
  <rect width="800" height="600" fill="url(#dotGrid)" />

  <!-- Outer Decorative Canvas Frame -->
  <rect x="40" y="40" width="720" height="520" rx="16" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7" />

  <!-- CENTRAL FLOATING EDITORIAL PAPER CARD -->
  <g filter="url(#softShadow)">
    <!-- Back Layer Abstract Geometric Sheet -->
    <rect x="230" y="130" width="340" height="340" rx="12" fill="#FFFFFF" opacity="0.6" transform="rotate(-4 400 300)" />
    
    <!-- Main Card Body -->
    <rect x="240" y="140" width="320" height="320" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Top Accent Ribbon -->
    <path d="M 240 152 C 240 145.37 245.37 140 252 140 L 548 140 C 554.63 140 560 145.37 560 152 L 560 146 L 240 146 Z" fill="url(#accentGradient)" />
  </g>

  <!-- CENTRAL GRAPHIC: ABSTRACT PHOTO & BOOK SILHOUETTE -->
  <g transform="translate(400, 270)">
    <!-- Sun / Perspective Circle -->
    <circle cx="35" cy="-35" r="18" fill="#9333EA" opacity="0.15" />
    <circle cx="35" cy="-35" r="8" fill="#9333EA" opacity="0.4" />

    <!-- Abstract Landscape / Open Book Pages Wave -->
    <path d="M -60 15 L -20 -20 C -5 -35 15 -35 30 -20 L 60 10 L 60 35 L -60 35 Z" fill="#64748B" opacity="0.2" />
    <path d="M -60 30 L -10 -15 C 5 -28 25 -28 40 -12 L 60 10 L 60 45 L -60 45 Z" fill="#475569" opacity="0.35" />

    <!-- Open Book Base Graphic -->
    <path d="M -45 40 Q 0 25 45 40 L 45 45 Q 0 30 -45 45 Z" fill="#0F172A" opacity="0.6" />
  </g>

  <!-- SKELETON CONTENT LINES (EDITORIAL TEXT SIMULATION) -->
  <g transform="translate(280, 365)" opacity="0.75">
    <!-- Line 1: Main Title Bar -->
    <rect x="0" y="0" width="160" height="8" rx="4" fill="#0F172A" opacity="0.3" />
    <!-- Line 2: Short Subtitle -->
    <rect x="0" y="18" width="240" height="6" rx="3" fill="#64748B" opacity="0.25" />
    <!-- Line 3: Body Line -->
    <rect x="0" y="32" width="200" height="6" rx="3" fill="#64748B" opacity="0.15" />
  </g>

  <!-- BADGE / ICON PILL -->
  <g transform="translate(400, 485)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0F172A" opacity="0.05" />
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="none" stroke="#CBD5E1" stroke-width="1" />
    
    <!-- Camera/Image Icon -->
    <path d="M -52 -3 L -48 -8 L -40 -8 L -36 -3 L -32 -3 C -30.9 -3 -30 -2.1 -30 -1 L -30 7 C -30 8.1 -30.9 9 -32 9 L -56 9 C -57.1 9 -58 8.1 -58 7 L -58 -1 C -58 -2.1 -57.1 -3 -56 -3 Z M -44 7 C -40.7 7 -38 4.3 -38 1 C -38 -2.3 -40.7 -5 -44 -5 C -47.3 -5 -50 -2.3 -50 1 C -50 4.3 -47.3 7 -44 7 Z" fill="#64748B" />
    
    <!-- Label Text -->
    <text x="-24" y="4" font-family="'Trebuchet MS', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.5">ADD COVER PHOTO</text>
  </g>
</svg>