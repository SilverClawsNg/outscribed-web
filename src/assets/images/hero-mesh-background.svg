<!-- Inline SVG Background: Concentric Perspective Grid -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" opacity="0.12">
  <defs>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066cc" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#121212" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="url(#fade)" stroke-width="1" fill="none" transform="translate(400,400)">
    <!-- Perspective Rays -->
    <line x1="-400" y1="-400" x2="400" y2="400" />
    <line x1="400" y1="-400" x2="-400" y2="400" />
    <line x1="0" y1="-400" x2="0" y2="400" />
    <line x1="-400" y1="0" x2="400" y2="0" />

    <!-- Concentric Reality Squares -->
    <rect x="-350" y="-350" width="700" height="700" />
    <rect x="-260" y="-260" width="520" height="520" />
    <rect x="-180" y="-180" width="360" height="360" />
    <rect x="-110" y="-110" width="220" height="220" opacity="0.8" />
    <rect x="-55" y="-55" width="110" height="110" opacity="0.6" />
    <rect x="-20" y="-20" width="40" height="40" opacity="0.4" />
  </g>
</svg>
