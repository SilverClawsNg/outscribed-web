name: Deploy Vue to Cloudflare Pages

on:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ─── PRODUCTION BUILD & DEPLOY ───
      - name: Build Vue App (Production)
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env:
          VITE_API_BASE_URL: "https://api.outscribed.com"
          VITE_MEDIA_BASE_URL: "https://media.outscribed.com"

      - name: Deploy to Production Project
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name="outscribed-web" --branch="main"

      # ─── STAGING BUILD & DEPLOY ───
      - name: Build Vue App (Staging)
        if: github.ref != 'refs/heads/main'
        run: npm run build
        env:
          VITE_API_BASE_URL: "https://staging-api.outscribed.com"
          VITE_MEDIA_BASE_URL: "https://staging-media.outscribed.com"

      - name: Deploy to Staging Project
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name="outscribed-web-staging" --branch="main"
